project_name: dqn_reward_misspecification_smoke

random_seeds:
  - 11

training_steps: 500
evaluation_steps: 200
learning_curve_points: 10

corruption_probabilities:
  - 0.0
  - 1.0

corruption_magnitudes:
  - 5.0

constraint_errors:
  - 0.0

agents:
  - reward_only_dqn
  - fixed_penalty_dqn
  - lagrangian_dqn
  - hard_shield_dqn

environments:
  - adversarial
  - truth_proxy
  - monitoring_shift

hidden_dimensions:
  - 32
  - 32

learning_rate: 0.001
gamma: 0.95

batch_size: 32
replay_capacity: 5000
replay_warmup: 64
target_update_interval: 50

epsilon_start: 1.0
epsilon_end: 0.05
epsilon_decay_steps: 400

fixed_penalty: 2.0

cost_limit: 0.02
lambda_learning_rate: 0.01
lambda_maximum: 100.0

gradient_clip: 10.0

device: cpu

output_dir: outputs/neural/dqn_smoke