name: tests

on:
  push:
    branches:
      - main
      - q1-experimental-redesign
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          python -m pip install \
            -r requirements-neural-ci.txt

      - name: Compile source files
        run: |
          python -m compileall \
            src \
            neural \
            scripts \
            tests

      - name: Run unit tests
        run: |
          python -m unittest discover \
            -s tests \
            -v